name: S4CS Direct Drive Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s4cs-drive-direct-recover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: aa011d208d65dca1ad38bd83302fa05364e51800
      RELEASE_TAG: v0.1.0-alpha.11
      DRIVE_BUNDLE_ID: 1YiwAclxwY4VHAuIsff12GrW4_Xa8MPYw
      BUNDLE_SHA256: 3b3a7cccf44caa42a645e0aa6c6ef2bf7309fc156ad9ec79377e95cab4be6b41
      BUNDLE_SIZE: '6374056'
    steps:
      - name: Check out staging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Try direct Google Drive download endpoints
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/Sims4CreatorStudio-v0.1.0-alpha.11.git.bundle"
          urls=(
            "https://drive.usercontent.google.com/download?id=${DRIVE_BUNDLE_ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&confirm=t&id=${DRIVE_BUNDLE_ID}"
            "https://drive.google.com/uc?export=download&id=${DRIVE_BUNDLE_ID}"
          )
          ok=0
          for url in "${urls[@]}"; do
            rm -f "$bundle"
            if curl --fail --location --retry 2 --max-time 90 "$url" -o "$bundle"; then
              if test "$(stat -c %s "$bundle")" = "$BUNDLE_SIZE" && echo "$BUNDLE_SHA256  $bundle" | sha256sum -c -; then
                ok=1
                break
              fi
            fi
          done
          test "$ok" = 1
          git bundle verify "$bundle"
          echo "bundle=$bundle" >> "$GITHUB_ENV"

      - name: Recover exact verified Alpha11 source
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/s4cs-alpha11"
          rm -rf "$src"
          git clone "$bundle" "$src"
          cd "$src"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-tree -r --name-only HEAD | wc -l | tr -d ' ')" = '248'
          test "$(git ls-tree -r --name-only HEAD wiki | grep -c '\.md$')" = '14'
          grep -Fq '"version": "0.1.0-alpha.11"' package.json

      - name: Re-run release validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/s4cs-alpha11"
          npm run build
          npm test
          npm run corruption
          npm run stress

      - name: Publish exact verified source and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/s4cs-alpha11"
          git remote remove origin || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$SOURCE_SHA:refs/heads/main" --force
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$SOURCE_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m 'Sims 4 Creator Studio v0.1.0-alpha.11'
          fi
          git push origin "refs/tags/$RELEASE_TAG" --force
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$SOURCE_SHA"
